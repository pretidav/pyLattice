name: Run Python Tests
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the tests import pylattice from the repo root
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: mpi4py/setup-mpi@v1
        with:
          mpi: openmpi
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test tensors
        run:  pytest tests/core/test_tensors.py
      - name: Run test input arguments and logs
        run:  pytest tests/core/test_cli.py
      - name: Run test Lattice
        run:  python tests/core/test_grid.py
      - name: Run test LatticeEO
        run:  python tests/core/test_grid_eo.py
      - name: Run test MPI Lattice
        run:  mpiexec -n 2 python tests/core/test_grid_mpi.py


