name: Run Python Tests
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the tests import pylattice from the repo root
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: mpi4py/setup-mpi@v1
        with:
          mpi: openmpi
      - name: Install Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test tensors
        run:  pytest tests/core/test_tensors.py
      - name: Run test vectorized lattice arithmetic
        run:  pytest tests/core/test_grid_vectorized.py
      - name: Run test input arguments and logs
        run:  pytest tests/core/test_cli.py
      - name: Run test Lattice
        run:  python tests/core/test_grid.py
      - name: Run test LatticeEO
        run:  python tests/core/test_grid_eo.py
      - name: Run test MPI Lattice
        run:  mpiexec -n 2 python tests/core/test_grid_mpi.py
      - name: Run test groups (discrete, SU(2), SU(N), common interface)
        run:  pytest tests/core/test_discrete.py tests/core/test_su2.py tests/core/test_su.py tests/core/test_group_interface.py
      - name: Run test SU(2) gauge field
        run:  pytest tests/theories/gauge/test_gauge_sun.py
      - name: Run test SU(2) gauge theory (Metropolis sweep)
        run:  pytest tests/theories/gauge/test_gauge_su2.py
      - name: Run test SU(2) offline measurements (loops)
        run:  pytest tests/theories/gauge/test_gauge_su2_meas.py
      - name: Run test SU(2) offline measurements in parallel
        run:  mpiexec -n 2 python tests/theories/gauge/test_gauge_su2_meas.py
      - name: Run test SU(2) gauge theory in parallel
        run:  mpiexec -n 2 python tests/theories/gauge/test_gauge_su2.py
      - name: Run test SU(2) gauge field in parallel
        run:  mpiexec -n 2 python tests/theories/gauge/test_gauge_sun_mpi.py
      - name: Run test random streams
        run:  pytest tests/core/test_rng.py
      - name: Run test random streams in parallel
        run:  mpiexec -n 2 python tests/core/test_rng.py
      - name: Run test statistics
        run:  pytest tests/core/test_stats.py
      - name: Run test Monte Carlo driver
        run:  pytest tests/core/test_montecarlo.py
      - name: Run test of the command line run
        run:  pytest tests/core/test_driver.py
      - name: Run test Monte Carlo driver in parallel
        run:  mpiexec -n 2 python tests/core/test_montecarlo.py
      - name: Run test callbacks (checkpoints and run log)
        run:  pytest tests/core/test_callbacks.py
      - name: Run test callbacks in parallel
        run:  mpiexec -n 2 python tests/core/test_callbacks.py
      - name: Run test Ising
        run:  pytest tests/theories/spin/test_ising.py
      - name: Run test Ising in parallel
        run:  mpiexec -n 2 python tests/theories/spin/test_ising.py
      - name: Run test Ising offline measurements
        run:  pytest tests/theories/spin/test_ising_meas.py
      - name: Run test Ising offline measurements in parallel
        run:  mpiexec -n 2 python tests/theories/spin/test_ising_meas.py
      - name: Run test plot_meas
        run:  pytest tests/utils/test_plot_meas.py
      - name: Run test of the local test script
        run:  pytest tests/utils/test_run_tests.py
