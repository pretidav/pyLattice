name: Run Python Tests
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # tests/ scripts import lattice, linalg, mpi, ... from the repo root
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: mpi4py/setup-mpi@v1
        with:
          mpi: openmpi
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test Linalg
        run:  pytest tests/test_linalg.py
      - name: Run test input arguments and logs
        run:  pytest tests/test_inputargs.py
      - name: Run test Lattice
        run:  python tests/test_lattice.py
      - name: Run test LatticeEO
        run:  python tests/test_lattice_EO.py
      - name: Run test MPI Lattice
        run:  mpiexec -n 2 python tests/test_lattice_mpi.py


